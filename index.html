<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yap · share your thoughts</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1 class="logo"><img src="y.png" width="200" height="200"> Yap</h1>
      <div id="authState">
        <!-- Logged-in user info and logout button will appear here -->
      </div>
    </header>

    <main>
      <!-- Login / Signup Form (shown when logged out) -->
      <div id="loginForm" class="card">
        <h2>Join the chatter</h2>
        <input type="email" id="email" placeholder="Email" />
        <input type="password" id="password" placeholder="Password" />
        <button id="loginBtn">Log In</button>
        <button id="signupBtn">Sign Up</button>
      </div>

      <!-- Post Form (shown when logged in) -->
      <div id="postForm" class="card hidden">
        <textarea id="message" placeholder="What's on your mind? (max 140 chars)" maxlength="140"></textarea>
        <button id="postBtn">Yap it!</button>
      </div>

      <!-- Feed of posts -->
      <div id="feed" class="feed"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
